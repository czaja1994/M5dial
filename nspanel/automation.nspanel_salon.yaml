# NSPanel Salon — blueprint automation (as-built export from HA)
#
# Source: automation.nspanel_salon  (HA instance 192.168.1.228)
# Blueprint: edwardtfn/nspanel_easy_blueprint.yaml  (NSPanel Easy, 2026.6.2)
# Exported: 2026-07-14
#
# To reproduce: import the NSPanel Easy blueprint, then create an automation
# from it and paste these inputs (or drop this into automations via UI/MCP).
# NOTE: `nspanel_name` is a device_id — re-point it to YOUR nspanel device.
#
# Companion HA helpers (see ha_helpers.md) that this config depends on:
#   switch.bedroom_room / switch.office_room  — smart room toggles (home tiles)
#   light.evening_mood                        — salon+kitchen mood scene group
#   light.office_mood                         — office desk/sofa/ball/printer group

id: "1782826202411"
alias: NSPanel Salon
description: ""
use_blueprint:
  path: edwardtfn/nspanel_easy_blueprint.yaml
  input:
    nspanel_name: 5db51b2d312b23044bce118ff8b866ac   # device: nspanel-salon

    # --- Screensaver / home ---
    weather_entity: weather.home
    indoortemp: sensor.nspanel_salon_temperature      # panel's own temp sensor
    home_value01: []                                  # room temps removed (kept screen legible)
    home_value02: []
    chip01: []                                         # light chips removed
    chip02: []
    icon_color_fallback_on: [255, 215, 0]              # YELLOW when any state is ON

    # Wake the screen on living-room presence.
    # REQUIRES `include_action_wake_up: true` in the nspanel ESPHome substitutions.
    wake_up_sensors:
      - binary_sensor.lightsensorlivingroom_occupancy

    # --- Home page tiles (custom buttons) ---
    # Bedroom/Office point at TEMPLATE SWITCHES (smart toggle), not the raw groups:
    #   indicator = any bulb on in the room; tap-ON -> all off;
    #   tap-OFF   -> Bedroom: bed via Adaptive Lighting; Office: printer+desktop+sofa+ball.
    home_custom_button01: switch.bedroom_room
    home_custom_button01_name: Bedroom
    home_custom_button01_icon: mdi:bed
    home_custom_button02: climate.bedroom_2            # AC Bedroom -> thermostat
    home_custom_button02_name: AC Bedroom
    home_custom_button02_icon: mdi:air-conditioner
    home_custom_button03: switch.office_room
    home_custom_button03_name: Office
    home_custom_button03_icon: mdi:desk-lamp
    home_custom_button04: climate.office              # AC Office -> thermostat
    home_custom_button04_name: AC Office
    home_custom_button04_icon: mdi:air-conditioner

    # --- Entity pages (☰ list icon on home -> slide pages) ---
    # Curated per room, NOT every bulb. Kitchen merged into Salon.
    # Entity keys are GLOBAL sequential: page1=01-08, page2=09-16, page3=17-24, page4=25-32.
    entity_page01_label: Salon                        # Salon + Kitchen as one room
    entities_entity01: light.shellyplus2pm_d48afc7e8694_switch_1   # BLACK Living Room
    entities_entity01_name: Main Salon
    entities_entity02: light.shellyplus2pm_d48afc7e8694_switch_0   # BLACK Kitchen
    entities_entity02_name: Main Kuch
    entities_entity03: light.evening_mood             # MAP+moodlamp+sunset+countertop+salon HUE
    entities_entity03_name: Evening Mood

    entity_page02_label: Sypialnia
    entities_entity09: light.shellybedroommain
    entities_entity09_name: Main
    entities_entity10: light.shellybedroomed
    entities_entity10_name: LED
    entities_entity11: light.bedroom_bed2             # Hue group, driven by Adaptive Lighting
    entities_entity11_name: Bed

    entity_page03_label: Biuro
    entities_entity17: light.shellyswitch25_3c6105e3695d_channel_1   # MAIN
    entities_entity17_name: Main
    entities_entity18: light.shellyswitch25_3c6105e3695d_channel_2   # OFFICE LED
    entities_entity18_name: LED
    entities_entity19: light.office_mood             # Desktop+Ball+Sofa+Printer
    entities_entity19_name: Mood
    # (page 4 / Kuchnia intentionally left empty — merged into Salon page 1)

    # --- Hardware buttons (relay decoupled: relay_X_local_fallback left OFF) ---
    # Right: living-room shades (normal cover, open/close toggle)
    right_button_entity: cover.shadeslivingroom
    right_button_name: Salon
    right_button_state_entity: cover.shadeslivingroom
    # Left: kitchen TILT blinds (cover.blind_tilt_ccd4 supports TILT only, sf=240).
    # Custom action toggles tilt (method mirrored from automation.ps5):
    #   tilt > 10  -> close (set_cover_tilt_position 0)
    #   else       -> open  (open_cover_tilt)
    left_button_entity: []
    left_button_name: Kuchnia
    left_button_state_entity: cover.blind_tilt_ccd4
    left_button_click_custom_action:
      - if:
          - condition: numeric_state
            entity_id: cover.blind_tilt_ccd4
            attribute: current_tilt_position
            above: 10
        then:
          - action: cover.set_cover_tilt_position
            target:
              entity_id: cover.blind_tilt_ccd4
            data:
              tilt_position: 0
        else:
          - action: cover.open_cover_tilt
            target:
              entity_id: cover.blind_tilt_ccd4
